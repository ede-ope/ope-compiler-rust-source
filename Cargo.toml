[package]
name = "ope"
version = "0.1.0"
edition = "2021"

[dependencies]
toml = "0.9"
serde = { version = "1", features = ["derive"] }
colored = "2"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
# is-terminal = "0.4"


[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
